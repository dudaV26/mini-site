<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heavy Metal - Contato</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Fale Conosco</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Mande sua mensagem</h2>
        <p>Compartilhe sua banda de Metal favorita conosco!</p>

        <form>
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" required placeholder="Digite seu nome" />

          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" required placeholder="Digite seu e-mail" />

          <label for="assunto">Assunto:</label>
          <input
            type="text"
            id="assunto"
            name="assunto"
            required
            placeholder="Ex: Recomendação de banda"
          />

          <label for="categoria">Categoria Favorita:</label>
          <select id="categoria" name="categoria" required>
            <option value="">Selecione uma opção...</option>
            <option value="classic">Classic Metal / Heavy Tradicional</option>
            <option value="thrash">Thrash Metal</option>
            <option value="doom">Doom Metal</option>
            <option value="rock">Hard Rock</option>
            <option value="indie">Indie Rock</option>
            <option value="nu">Nu Metal</option>
            <option value="outros">Outros</option>
          </select>

          <label for="comentario">Comentário:</label>
          <textarea
            id="comentario"
            name="comentario"
            rows="5"
            required
            placeholder="Escreva sua mensagem aqui..."
          ></textarea>

          <button type="submit">Enviar Mensagem</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
